name: Build Agent

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout slsk-ui
        uses: actions/checkout@v4
        with:
          repository: arenazl/slsk-ui
          path: slsk-ui-src
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build UI
        shell: bash
        run: |
          cd slsk-ui-src
          npm ci
          npm run build
          cd ..
          cp -r slsk-ui-src/dist ui-dist
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install nuitka pystray pillow aiohttp aioslsk cloudinary ordered-set zstandard selenium webdriver-manager mutagen send2trash
      - name: Cache Nuitka
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\Nuitka\Nuitka\Cache
            .nuitka-cache
          key: nuitka-${{ runner.os }}-py3.12-${{ hashFiles('agent.py') }}
          restore-keys: |
            nuitka-${{ runner.os }}-py3.12-
      - name: Build with Nuitka
        run: |
          python -m nuitka --onefile --jobs=4 --assume-yes-for-downloads --enable-plugin=tk-inter --windows-icon-from-ico=icon.ico --company-name="GrooveSync" --product-name="GrooveSync Agent" --file-version=2.0.0 --product-version=2.0.0 --file-description="GrooveSync Local Agent" --windows-console-mode=disable --include-data-files=icon.ico=icon.ico --include-data-files=logo.png=logo.png --include-data-dir=ui-dist=ui-dist --output-filename=GrooveSyncAgent.exe agent.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-Windows
          path: GrooveSyncAgent.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout slsk-ui
        uses: actions/checkout@v4
        with:
          repository: arenazl/slsk-ui
          path: slsk-ui-src
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build UI
        run: |
          cd slsk-ui-src
          npm ci
          npm run build
          cd ..
          cp -r slsk-ui-src/dist ui-dist
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pyinstaller rumps pystray pillow aiohttp aioslsk cloudinary selenium webdriver-manager mutagen send2trash
      - name: Create menubar icon
        run: |
          python -c "
          from PIL import Image
          img = Image.open('logo_transparent.png').convert('RGBA')
          w, h = img.size
          s = min(w, h)
          left = (w - s) // 2
          top = (h - s) // 2
          img = img.crop((left, top, left + s, top + s))
          img = img.resize((44, 44), Image.LANCZOS)
          img.save('menubar_icon.png')
          "
      - name: Build with PyInstaller
        run: pyinstaller -y GrooveSyncAgent.spec
      - name: Remove quarantine + ad-hoc sign
        run: |
          xattr -cr dist/GrooveSyncAgent.app || true
          codesign --force --deep --sign - dist/GrooveSyncAgent.app || true
      - name: Create DMG
        run: |
          set -e
          VOL="GrooveSyncAgent"
          # Imagen RW con espacio de sobra (tamano de la app + 60 MB).
          SIZE=$(du -sm dist/GrooveSyncAgent.app | cut -f1)
          SIZE=$((SIZE + 60))
          hdiutil create -volname "$VOL" -size ${SIZE}m -fs HFS+ -ov dist/rw.dmg
          # Montar, copiar la app + symlink a /Applications, desmontar (con retry).
          DEV=$(hdiutil attach -readwrite -noverify -noautoopen dist/rw.dmg | egrep '^/dev/' | head -1 | awk '{print $1}')
          cp -R dist/GrooveSyncAgent.app "/Volumes/$VOL/"
          ln -s /Applications "/Volumes/$VOL/Applications"
          sync
          for i in 1 2 3 4 5; do
            if hdiutil detach "$DEV"; then break; fi
            echo "detach busy, retry $i..."; sleep 3
          done
          # Convertir a comprimido de solo-lectura (UDZO).
          hdiutil convert dist/rw.dmg -format UDZO -o dist/GrooveSyncAgent-macOS.dmg
          rm -f dist/rw.dmg
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-macOS
          path: dist/GrooveSyncAgent-macOS.dmg

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/agent-Windows/GrooveSyncAgent.exe
            artifacts/agent-macOS/GrooveSyncAgent-macOS.dmg
